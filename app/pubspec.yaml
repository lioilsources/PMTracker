name: pmtracker
description: Firemní time tracker s geofencingem a offline podporou.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Supabase
  supabase_flutter: ^2.8.4
  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  # Navigation
  go_router: ^14.6.2
  # Location
  geolocator: ^13.0.2
  # Storage
  shared_preferences: ^2.3.5
  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  # PowerSync (offline sync)
  powersync: ^1.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
